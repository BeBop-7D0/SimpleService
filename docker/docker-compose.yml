version: '3.8'


services:
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  app-server:
    container_name: AppServer
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    restart: unless-stopped

    depends_on:
      - postgres
